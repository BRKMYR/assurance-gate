schema_version: "1.0"
track: a
suite: holdout
frozen: true
gates:
  - id: a.hard.ped_collision
    class: hard
    kind: count
    family: ped_occluded
    predicate: "metrics.collision == false"
    threshold: 0
    direction: max
    severity: high
    min_n: 14
    rationale: "A pedestrian strike has no margin to trade against, so the count is zero, the gate is hard and no waiver applies."
    source: "ISO 21448:2022 clause 7 (informative)"
  - id: a.soft.ttc_cutin
    class: soft
    kind: rate
    family: cut_in
    predicate: "metrics.ttc_min_s >= 1.5"
    threshold: 0.60
    direction: floor
    severity: medium
    min_n: 14
    rationale: "1.5 s is the surrogate boundary between a controlled brake and a conflict. A floor of 0.60 on the lower bound tolerates two misses in 16 runs and fails on three."
    source: "ISO 21448:2022 Annex C (informative)"
  - id: a.soft.ttc_hardbrake
    class: soft
    kind: rate
    family: hard_brake
    predicate: "metrics.ttc_min_s >= 1.5"
    threshold: 0.60
    direction: floor
    severity: medium
    min_n: 12
    rationale: "Same 1.5 s boundary on 14 runs, where a floor of 0.60 on the bound tolerates one miss."
    source: "ISO 21448:2022 Annex C (informative)"
  - id: a.soft.dmin_all
    class: soft
    kind: rate
    family: all
    predicate: "metrics.d_min_m >= 0.5"
    threshold: 0.60
    direction: floor
    severity: medium
    min_n: 50
    rationale: "0.5 m is the closest pass that still clears the disc approximation of the engine, measured over all 60 runs."
    source: "UL 4600:2023 Section 8 (informative)"
  - id: a.soft.severity_weather
    class: soft
    kind: rate
    family: weather_ramp
    predicate: "severity_tier != \"critical\""
    threshold: 0.60
    direction: floor
    severity: medium
    min_n: 12
    rationale: "In a visibility ramp the planner has seconds to slow down, so a critical tier means it did not react. The floor tolerates one such run in 14."
    source: "ISO 21448:2022 clause 7 (informative)"
  - id: a.avail.hard_brake
    class: availability
    kind: rate
    family: all
    predicate: "metrics.hard_brake_fraction <= 0.10"
    threshold: 0.60
    direction: floor
    severity: low
    min_n: 50
    rationale: "A planner that brakes hard in more than one run in ten is passing the safety gates by making the ride unusable."
    source: "UL 4600:2023 Section 16 (informative)"
  - id: a.avail.speed
    class: availability
    kind: rate
    family: all
    predicate: "metrics.mean_speed_ratio >= 0.80"
    threshold: 0.60
    direction: floor
    severity: low
    min_n: 50
    rationale: "A planner below 80 percent of target speed is avoiding conflict by not driving, so safety gates alone cannot clear it."
    source: "UL 4600:2023 Section 16 (informative)"
  - id: a.cov.bins
    class: coverage
    kind: count
    family: all
    predicate: ""
    threshold: 0
    direction: max
    severity: medium
    min_n: 0
    rationale: "An empty parameter bin is a region of the design space with zero runs, and zero runs cannot support a GO."
    source: "UL 4600:2023 Section 8 (informative)"
  - id: a.reg.paired
    class: regression
    kind: count
    family: all
    predicate: ""
    threshold: 0
    direction: max
    severity: medium
    min_n: 0
    rationale: "The suite is deterministic and paired by scenario id. Any scenario with a worse tier or a TTC drop over 0.5 s is a regression, whatever the family mean says."
    source: "ISO 21448:2022 Annex C (informative)"
